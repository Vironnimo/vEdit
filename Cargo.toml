[package]
name = "vedit"
version = "0.4.35"
edition = "2024"
description = "A calm, multi-project code editor for Windows"
license = "MIT"
default-run = "vedit"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui_extras = { version = "0.36.2", features = ["syntect"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
regex = "1"
tiktoken-rs = "0.12.1"
pulldown-cmark = { version = "0.13.4", default-features = false }
similar = "2.7"

[[bin]]
name = "vedit"
path = "src/main.rs"

[[bin]]
name = "vedit-cli"
path = "src/cli_main.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["snapshot", "wgpu"] }
egui-wgpu = { version = "0.36.2", default-features = false }

[patch.crates-io]
# Windows mixed-DPI dragging and custom chrome: see vendor/winit/VEDIT_PATCH.md.
winit = { path = "vendor/winit" }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
