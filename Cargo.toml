[package]
name = "morrow"
version = "0.4.3"
edition = "2024"
description = "A calm, multi-project code editor for Windows"
license = "MIT"
default-run = "morrow"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui_extras = { version = "0.36.2", features = ["syntect"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
regex = "1"
pulldown-cmark = { version = "0.13.4", default-features = false }

[[bin]]
name = "morrow"
path = "src/main.rs"

[[bin]]
name = "morrow-cli"
path = "src/cli_main.rs"

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["snapshot", "wgpu"] }
egui-wgpu = { version = "0.36.2", default-features = false }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
