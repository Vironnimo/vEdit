[package]
name = "vedit"
version = "0.6.2"
edition = "2024"
description = "A calm, multi-project code editor for Windows"
license = "MIT"
default-run = "vedit"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui_extras = { version = "0.36.2", features = ["syntect"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
ignore = "0.4"
regex = "1"
tiktoken-rs = "0.12.1"
pulldown-cmark = { version = "0.13.4", default-features = false }
similar = "2.7"
notify = { version = "8.2.0", default-features = false }
unicode-segmentation = "1.13.3"

[build-dependencies]
winresource = "0.1.34"

[[bin]]
name = "vedit"
path = "src/main.rs"

[[bin]]
name = "vedit-cli"
path = "src/cli_main.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
egui_kittest = { version = "0.36.2", features = ["snapshot", "wgpu"] }
egui-wgpu = { version = "0.36.2", default-features = false }
egui-winit = { version = "0.36.2", default-features = false }

[patch.crates-io]
# Present the first Glow frame before showing the window: see vendor/eframe/VEDIT_PATCH.md.
eframe = { path = "vendor/eframe" }
# Windows mixed-DPI dragging, custom chrome and file-drop coordinates: see vendor/winit/VEDIT_PATCH.md.
winit = { path = "vendor/winit" }
# Preserve keys before clipboard events: see vendor/egui-winit/VEDIT_PATCH.md.
egui-winit = { path = "vendor/egui-winit" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = true
